databases:
  - name: itam-db
    plan: free
    databaseName: itam
    user: itam

services:
  - type: web
    name: itam-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE_ENROLLMENT_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: itam-db
          property: connectionString
      - key: DEVICE_OFFLINE_AFTER_MINUTES
        value: "20"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
